<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Java Lab Formatter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Java Lab Formatter</h1>

        <p>
            Upload your Java lab question PDF and generate a
            properly formatted TXT file.
        </p>

        <div class="upload-box">

            <input type="file" id="pdfFile" accept=".pdf">

            <p id="fileName">No file selected</p>

        </div>

        <button id="generateBtn">
            Generate TXT
        </button>
        <!-- Area where extracted PDF text will be displayed -->
        <pre id="output"></pre>

    </div>

    <script src="script.js"></script>

</body>

</html>
