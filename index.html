<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Java Lab Formatter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Java Lab Formatter</h1>

        <p>
            Convert your Java lab question PDF into a properly formatted TXT file.
        </p>

        <input type="file" id="pdfFile" accept=".pdf">

        <button id="generateBtn">
            Generate TXT
        </button>

    </div>

    <script src="script.js"></script>

</body>
</html>
